{{- if .Values.stegostore.enabled }}
{{- /*
Every instance shares this chart, so a fixed minute starts all of their backups at
once and overflows the customer-db nodes. Swap the minute for one derived from the
namespace so each instance keeps a stable slot but the starts spread over the hour.
*/}}
{{- $schedule := .Values.stegostore.schedule }}
{{- $fields := splitList " " $schedule }}
{{- if and .Values.stegostore.staggerMinute (eq (len $fields) 5) }}
{{- $minute := mod (atoi (adler32sum .Release.Namespace)) 60 }}
{{- $schedule = printf "%d %s" $minute (rest $fields | join " ") }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stegostore
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: stegostore
    data.portswigger.cloud/pii: "true"
    data.portswigger.cloud/retention-period: subscription-lifetime
    data.portswigger.cloud/data-type: customer
    data.portswigger.cloud/data-classification: confidential
spec:
  schedule: {{ $schedule | quote }}
  successfulJobsHistoryLimit: 0
  concurrencyPolicy: {{.Values.stegostore.concurrencyPolicy}}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stegostore
        spec:
          serviceAccountName: postgres
          nodeSelector:
            NodeType: customer-db
          tolerations:
            - key: portswigger.cloud/customer
              operator: Exists
          containers:
          - name: stegostore
            image: {{ .Values.aws.account_id }}.dkr.ecr.{{ .Values.stegostore.imageRegion }}.amazonaws.com/{{ .Values.stegostore.imageName }}@{{ .Values.stegostore.imageDigest }}
            imagePullPolicy: IfNotPresent
            env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: dbname
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: port
            - name: S3PATH
              value: "s3://{{ .Values.aws.resourcePrefix }}{{ .Values.stackId }}/stegostore/"
            - name: PGHOST
              value: "postgres-rw"
          restartPolicy: Never
{{- end }}