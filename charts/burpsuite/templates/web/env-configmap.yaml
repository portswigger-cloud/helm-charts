apiVersion: v1
kind: ConfigMap
metadata:
  name: web-env
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: web
{{ include "burpsuite.labels" . | indent 4 }}
data:
  BSEE_INSTALLATION_ENVIRONMENT: {{ .Values.installationEnvironment }}
  BSEE_RUN_MODE: {{ .Values.runMode }}
  BSEE_SERVER_URL: "https://localhost:8072"
  WEB_SERVER_OPTS: {{ .Values.web.serverJavaOpts }}
  BSEE_CLIENT_KEYSTORE_LOCATION: /home/burpsuite/keystores/webserver.keystore
  BSEE_CLIENT_TRUSTSTORE_LOCATION: /home/burpsuite/keystores/webserver.keystore
  BSEE_DATA_PATH: /home/burpsuite/data
  BSEE_BURP_DOWNLOAD_PATH: /home/burpsuite/burp
  BSEE_HTTP_PORT: "8080"
  BSEE_SCIM_SERVER_HTTP_PORT: "8089"
  BSEE_HTTPS_REDIRECT_PORT: "443"
  BSEE_LOGS_DIRECTORY: /home/burpsuite/logs
  BSEE_SAAS_IP_RANGES_URL: {{ .Values.web.ipRangesAppUrl }}
  BSEE_SAAS_IDLE_TIME_BEFORE_PAUSE: {{ .Values.globalEnv.idleTimeBeforePause | quote }}
  OTEL_ENVIRONMENT: {{ .Values.globalEnv.otelEnvironment | quote }}
  AWS_REGION: {{ .Values.globalEnv.awsRegion | quote }}
{{- if .Values.aws.s3.enabled }}
  BSEE_AWS_S3_BUCKET_NAME: {{ .Values.aws.resourcePrefix }}{{ .Release.Namespace }}
{{- end }}
{{- $features := .Values.web.enabledProfileFeatures | default list }}
{{- if .Values.aws.s3.enabled }}
{{- $features = append $features "USE_S3_FOR_PROJECT_FILES" }}
{{- end }}
{{- if .Values.oidc.enabled }}
{{- $features = append $features "SUPPORTS_OIDC_LOGIN" }}
  BSEE_OIDC_ISSUER: {{ required "oidc.issuer is required when OIDC is enabled" .Values.oidc.issuer | quote }}
  BSEE_OIDC_CLIENT_ID: {{ required "oidc.clientId is required when OIDC is enabled" .Values.oidc.clientId | quote }}
  BSEE_OIDC_REDIRECT_URI: {{ printf "https://%s/api-internal/oidc/callback" (required "an ingress host is required when OIDC is enabled" (first .Values.ingress.hosts).host) | quote }}
  BSEE_OIDC_SCOPES: {{ .Values.oidc.scopes | quote }}
  BSEE_OIDC_GROUPS_CLAIM: {{ .Values.oidc.groupsClaim | quote }}
{{- with .Values.oidc.discoveryUrl }}
  BSEE_OIDC_DISCOVERY_URL: {{ . | quote }}
{{- end }}
{{- end }}
{{- if $features }}
  ENABLED_PROFILE_FEATURES: {{ $features | uniq | join "," | quote }}
{{- end }}
{{- with ((.Values.agenticTesting | default dict).instance | default dict) }}
{{- if .provisioningTokenIssuer }}
  BSEE_AT_INSTANCE_PROVISIONING_TOKEN_ISSUER: {{ .provisioningTokenIssuer | quote }}
{{- end }}
{{- if .provisioningTokenPublicKey }}
  BSEE_AT_INSTANCE_PROVISIONING_TOKEN_PUBLIC_KEY: {{ .provisioningTokenPublicKey | quote }}
{{- end }}
{{- if .m2mAuthTokenUrl }}
  # The hosted dashboard needs this to start, whether or not agentic testing is enabled
  BSEE_AT_INSTANCE_M2M_AUTH_TOKEN_URL: {{ .m2mAuthTokenUrl | quote }}
{{- end }}
{{- end }}
{{- if (.Values.agenticTesting | default dict).enabled }}
{{- with .Values.agenticTesting.instance }}
  BSEE_AT_INSTANCE_GATEWAY_URL: {{ .gatewayUrl | quote }}
  BSEE_AT_INSTANCE_M2M_AUDIENCE: {{ .m2mAudience | quote }}
  BSEE_AT_INSTANCE_SERVER_PORT: {{ .chatPort | quote }}
{{- if .chatHost }}
  BSEE_AT_INSTANCE_EMBED_BASE_URL: {{ printf "https://%s" .chatHost | quote }}
{{- end }}
{{- end }}
{{- else }}
  # The hosted dashboard profile turns agentic testing on, disable it by default
  DISABLED_PROFILE_FEATURES: SUPPORTS_AGENTIC_TESTING
{{- end }}
{{- with ((.Values.analytics | default dict).posthog | default dict) }}
{{- if .projectToken }}
  BSEE_POSTHOG_PROJECT_TOKEN: {{ .projectToken | quote }}
{{- end }}
{{- if .apiHost }}
  BSEE_POSTHOG_API_HOST: {{ .apiHost | quote }}
{{- end }}
{{- end }}
