{{- $agenticTesting := .Values.agenticTesting | default dict -}}
{{- if and .Values.ingress.enabled $agenticTesting.enabled $agenticTesting.instance.chatHost -}}
{{- $fullName := include "burpsuite.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-burp-at
  labels:
    {{- include "burpsuite.labels" . | nindent 4 }}
  {{- with $agenticTesting.chatIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $agenticTesting.instance.chatHost | quote }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http-burp-at
{{- end }}
