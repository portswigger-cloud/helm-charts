suite: Enterprise env Secret configuration
templates:
  - enterprise/env-secret.yaml
tests:
  - it: should not set Burp AT toolbox Auth0 credentials by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: enterprise-env
      - notExists:
          path: data.BSEE_BURP_AT_TOOLBOX_AUTH0_CLIENT_ID
      - notExists:
          path: data.BSEE_BURP_AT_TOOLBOX_AUTH0_CLIENT_SECRET
  - it: should set Burp AT toolbox Auth0 credentials when configured
    set:
      enterprise:
        burpAtToolboxAuth0ClientId: not-a-client-id
        burpAtToolboxAuth0ClientSecret: not-a-client-secret
    asserts:
      - equal:
          path: data.BSEE_BURP_AT_TOOLBOX_AUTH0_CLIENT_ID
          decodeBase64: true
          value: not-a-client-id
      - equal:
          path: data.BSEE_BURP_AT_TOOLBOX_AUTH0_CLIENT_SECRET
          decodeBase64: true
          value: not-a-client-secret
  - it: should omit the secret when only the client id is set
    set:
      enterprise:
        burpAtToolboxAuth0ClientId: not-a-client-id
    asserts:
      - equal:
          path: data.BSEE_BURP_AT_TOOLBOX_AUTH0_CLIENT_ID
          decodeBase64: true
          value: not-a-client-id
      - notExists:
          path: data.BSEE_BURP_AT_TOOLBOX_AUTH0_CLIENT_SECRET
  - it: should not set enterprise Auth0 credentials by default
    asserts:
      - notExists:
          path: data.BSEE_AUTH0_CLIENT_ID
      - notExists:
          path: data.BSEE_AUTH0_CLIENT_SECRET
  - it: should set enterprise Auth0 credentials when configured
    set:
      enterprise:
        auth0ClientId: not-a-client-id
        auth0ClientSecret: not-a-client-secret
    asserts:
      - equal:
          path: data.BSEE_AUTH0_CLIENT_ID
          decodeBase64: true
          value: not-a-client-id
      - equal:
          path: data.BSEE_AUTH0_CLIENT_SECRET
          decodeBase64: true
          value: not-a-client-secret
  - it: should keep enterprise and toolbox Auth0 credentials apart
    set:
      enterprise:
        auth0ClientId: enterprise-id
        auth0ClientSecret: enterprise-secret
        burpAtToolboxAuth0ClientId: toolbox-id
        burpAtToolboxAuth0ClientSecret: toolbox-secret
    asserts:
      - equal:
          path: data.BSEE_AUTH0_CLIENT_ID
          decodeBase64: true
          value: enterprise-id
      - equal:
          path: data.BSEE_AUTH0_CLIENT_SECRET
          decodeBase64: true
          value: enterprise-secret
      - equal:
          path: data.BSEE_BURP_AT_TOOLBOX_AUTH0_CLIENT_ID
          decodeBase64: true
          value: toolbox-id
      - equal:
          path: data.BSEE_BURP_AT_TOOLBOX_AUTH0_CLIENT_SECRET
          decodeBase64: true
          value: toolbox-secret
