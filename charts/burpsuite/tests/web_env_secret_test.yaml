suite: Web env Secret configuration
templates:
  - web/env-secret.yaml
tests:
  - it: should not set Auth0 credentials by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: web-env
      - notExists:
          path: data.BSEE_AUTH0_CLIENT_ID
      - notExists:
          path: data.BSEE_AUTH0_CLIENT_SECRET
  - it: should set Auth0 credentials when configured
    set:
      web:
        auth0ClientId: not-a-client-id
        auth0ClientSecret: not-a-client-secret
    asserts:
      - equal:
          path: data.BSEE_AUTH0_CLIENT_ID
          decodeBase64: true
          value: not-a-client-id
      - equal:
          path: data.BSEE_AUTH0_CLIENT_SECRET
          decodeBase64: true
          value: not-a-client-secret
  - it: should omit the secret when only the client id is set
    set:
      web:
        auth0ClientId: not-a-client-id
    asserts:
      - equal:
          path: data.BSEE_AUTH0_CLIENT_ID
          decodeBase64: true
          value: not-a-client-id
      - notExists:
          path: data.BSEE_AUTH0_CLIENT_SECRET
