suite: Agentic testing configuration
templates:
  - deployment.yaml
  - enterprise/env-configmap.yaml
  - enterprise/env-secret.yaml
  - web/env-configmap.yaml
  - web/env-secret.yaml
tests:
  - it: should disable agentic testing on the web server by default
    template: web/env-configmap.yaml
    asserts:
      - equal:
          path: data.DISABLED_PROFILE_FEATURES
          value: SUPPORTS_AGENTIC_TESTING
      - notExists:
          path: data.BSEE_AT_INSTANCE_GATEWAY_URL
  - it: should disable agentic testing on the enterprise server by default
    template: enterprise/env-configmap.yaml
    asserts:
      - equal:
          path: data.DISABLED_PROFILE_FEATURES
          value: SUPPORTS_AGENTIC_TESTING
      - notExists:
          path: data.BSEE_AT_TOOLBOX_MCP_BRIDGE_URL
  - it: should not reference either client by default
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name == "enterprise")].env
          content:
            name: BSEE_AT_INSTANCE_M2M_AUTH_CLIENT_ID
          any: true
      - notContains:
          path: spec.template.spec.containers[?(@.name == "web")].env
          content:
            name: BSEE_AT_TOOLBOX_M2M_CLIENT_ID
          any: true
  - it: should tolerate a null agenticTesting key
    template: web/env-configmap.yaml
    set:
      agenticTesting: null
    asserts:
      - equal:
          path: data.DISABLED_PROFILE_FEATURES
          value: SUPPORTS_AGENTIC_TESTING
  - it: should give the web server the instance settings when enabled
    template: web/env-configmap.yaml
    set:
      agenticTesting:
        enabled: true
    asserts:
      - notExists:
          path: data.DISABLED_PROFILE_FEATURES
      - equal:
          path: data.BSEE_AT_INSTANCE_GATEWAY_URL
          value: https://ai.portswigger.net
      - equal:
          path: data.BSEE_AT_INSTANCE_M2M_AUDIENCE
          value: https://ai.portswigger.net
      - equal:
          path: data.BSEE_AT_INSTANCE_M2M_AUTH_TOKEN_URL
          value: https://login.portswigger.net/oauth/token
  - it: should give the enterprise server the instance and toolbox settings when enabled
    template: enterprise/env-configmap.yaml
    set:
      agenticTesting:
        enabled: true
    asserts:
      - notExists:
          path: data.DISABLED_PROFILE_FEATURES
      - equal:
          path: data.BSEE_AT_INSTANCE_GATEWAY_URL
          value: https://ai.portswigger.net
      - equal:
          path: data.BSEE_AT_INSTANCE_MCP_SERVER_URL
          value: http://enterprise-mcp-bridge-internal.enterprise:8002/mcp
      - equal:
          path: data.BSEE_AT_INSTANCE_M2M_AUTH_TOKEN_URL
          value: https://login.portswigger.net/oauth/token
      - equal:
          path: data.BSEE_AT_TOOLBOX_M2M_TOKEN_ENDPOINT
          value: https://login.portswigger.net/oauth/token
      - equal:
          path: data.BSEE_AT_TOOLBOX_MCP_BRIDGE_URL
          value: https://enterprise-mcp-bridge.platform-prod.portswigger.io
      - equal:
          path: data.BSEE_AT_TOOLBOX_MCP_BRIDGE_AUDIENCE
          value: https://ai.portswigger.net
      - equal:
          path: data.BSEE_AT_TOOLBOX_PLATFORM_API_URL
          value: https://ai.portswigger.net
      - equal:
          path: data.BSEE_AT_TOOLBOX_PLATFORM_API_AUDIENCE
          value: https://ai.portswigger.net
  - it: should give both servers the instance and scanner clients when enabled
    template: deployment.yaml
    set:
      agenticTesting:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "web")].env
          content:
            name: BSEE_AT_INSTANCE_M2M_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: at-instance-m2m-client
                key: client-id
      - contains:
          path: spec.template.spec.containers[?(@.name == "enterprise")].env
          content:
            name: BSEE_AT_INSTANCE_M2M_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: at-instance-m2m-client
                key: client-secret
      - contains:
          path: spec.template.spec.containers[?(@.name == "web")].env
          content:
            name: BSEE_AT_TOOLBOX_M2M_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: toolbox-m2m-client
                key: client-id
      - contains:
          path: spec.template.spec.containers[?(@.name == "enterprise")].env
          content:
            name: BSEE_AT_TOOLBOX_M2M_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: toolbox-m2m-client
                key: client-secret
