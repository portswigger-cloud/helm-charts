suite: Agentic testing configuration
templates:
  - deployment.yaml
  - service.yaml
  - enterprise/env-configmap.yaml
  - enterprise/env-secret.yaml
  - web/env-configmap.yaml
  - web/env-secret.yaml
tests:
  # The licence's product configuration decides whether a customer can run agentic tests
  - it: should not disable agentic testing on the web server
    template: web/env-configmap.yaml
    asserts:
      - notExists:
          path: data.DISABLED_PROFILE_FEATURES
  - it: should not disable agentic testing on the enterprise server
    template: enterprise/env-configmap.yaml
    asserts:
      - notExists:
          path: data.DISABLED_PROFILE_FEATURES
  - it: should disable agentic testing on the web server with the kill switch
    template: web/env-configmap.yaml
    set:
      agenticTesting:
        killSwitch: true
    asserts:
      - equal:
          path: data.DISABLED_PROFILE_FEATURES
          value: SUPPORTS_AGENTIC_TESTING
      - equal:
          path: data.BSEE_AT_INSTANCE_GATEWAY_URL
          value: https://ai.portswigger.net
  - it: should disable agentic testing on the enterprise server with the kill switch
    template: enterprise/env-configmap.yaml
    set:
      agenticTesting:
        killSwitch: true
    asserts:
      - equal:
          path: data.DISABLED_PROFILE_FEATURES
          value: SUPPORTS_AGENTIC_TESTING
      - equal:
          path: data.BSEE_AT_TOOLBOX_MCP_BRIDGE_URL
          value: https://agent-mcp.portswigger.net
  - it: should give the web server the M2M token URL by default
    template: web/env-configmap.yaml
    asserts:
      - equal:
          path: data.BSEE_AT_INSTANCE_M2M_AUTH_TOKEN_URL
          value: https://login.portswigger.net/oauth/token
  - it: should give the enterprise server the M2M token URL by default
    template: enterprise/env-configmap.yaml
    asserts:
      - equal:
          path: data.BSEE_AT_INSTANCE_M2M_AUTH_TOKEN_URL
          value: https://login.portswigger.net/oauth/token
  - it: should not give either server an M2M client pair
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name == "enterprise")].env
          content:
            name: BSEE_AT_INSTANCE_M2M_AUTH_CLIENT_ID
          any: true
      - notContains:
          path: spec.template.spec.containers[?(@.name == "web")].env
          content:
            name: BSEE_AT_TOOLBOX_M2M_CLIENT_ID
          any: true
  - it: should give the web server the production registry's issuer and key by default
    template: web/env-configmap.yaml
    asserts:
      - equal:
          path: data.BSEE_AT_INSTANCE_PROVISIONING_TOKEN_ISSUER
          value: https://auth-product-registry.platform-prod.portswigger.io/
      - matchRegex:
          path: data.BSEE_AT_INSTANCE_PROVISIONING_TOKEN_PUBLIC_KEY
          pattern: ^-----BEGIN PUBLIC KEY-----\n(.+\n)+-----END PUBLIC KEY-----\n$
  - it: should give the web server an overridden registry issuer and key
    template: web/env-configmap.yaml
    set:
      agenticTesting:
        instance:
          provisioningTokenIssuer: https://registry.example/
          provisioningTokenPublicKey: |
            -----BEGIN PUBLIC KEY-----
            test
            -----END PUBLIC KEY-----
    asserts:
      - equal:
          path: data.BSEE_AT_INSTANCE_PROVISIONING_TOKEN_ISSUER
          value: https://registry.example/
      - equal:
          path: data.BSEE_AT_INSTANCE_PROVISIONING_TOKEN_PUBLIC_KEY
          value: |
            -----BEGIN PUBLIC KEY-----
            test
            -----END PUBLIC KEY-----
  - it: should not give the enterprise server the registry issuer or key
    template: enterprise/env-configmap.yaml
    asserts:
      - notExists:
          path: data.BSEE_AT_INSTANCE_PROVISIONING_TOKEN_ISSUER
      - notExists:
          path: data.BSEE_AT_INSTANCE_PROVISIONING_TOKEN_PUBLIC_KEY
  - it: should give the web server the instance settings
    template: web/env-configmap.yaml
    asserts:
      - equal:
          path: data.BSEE_AT_INSTANCE_GATEWAY_URL
          value: https://ai.portswigger.net
      - equal:
          path: data.BSEE_AT_INSTANCE_M2M_AUDIENCE
          value: https://ai-long-lived.portswigger.net
      - equal:
          path: data.BSEE_AT_INSTANCE_M2M_AUTH_TOKEN_URL
          value: https://login.portswigger.net/oauth/token
  - it: should give the enterprise server the instance and toolbox settings
    template: enterprise/env-configmap.yaml
    asserts:
      - equal:
          path: data.BSEE_AT_INSTANCE_GATEWAY_URL
          value: https://ai.portswigger.net
      - equal:
          path: data.BSEE_AT_INSTANCE_MCP_SERVER_URL
          value: http://enterprise-mcp-bridge-internal.enterprise:8002/mcp
      - equal:
          path: data.BSEE_AT_INSTANCE_M2M_AUTH_TOKEN_URL
          value: https://login.portswigger.net/oauth/token
      - equal:
          path: data.BSEE_AT_TOOLBOX_M2M_TOKEN_ENDPOINT
          value: https://login.portswigger.net/oauth/token
      - equal:
          path: data.BSEE_AT_TOOLBOX_MCP_BRIDGE_URL
          value: https://agent-mcp.portswigger.net
      - equal:
          path: data.BSEE_AT_TOOLBOX_MCP_BRIDGE_AUDIENCE
          value: https://ai-long-lived.portswigger.net
      - equal:
          path: data.BSEE_AT_TOOLBOX_PLATFORM_API_URL
          value: https://ai.portswigger.net
      - equal:
          path: data.BSEE_AT_TOOLBOX_PLATFORM_API_AUDIENCE
          value: https://ai-long-lived.portswigger.net
  - it: should open the chat port on the web server
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "web")].ports
          content:
            name: web-burp-at
            containerPort: 8099
  - it: should publish the chat port on the Service
    template: service.yaml
    asserts:
      - contains:
          path: spec.ports
          content:
            port: 8099
            targetPort: web-burp-at
            protocol: TCP
            name: http-burp-at
  - it: should tell the web server the chat port
    template: web/env-configmap.yaml
    asserts:
      - equal:
          path: data.BSEE_AT_INSTANCE_SERVER_PORT
          value: "8099"
      - notExists:
          path: data.BSEE_AT_INSTANCE_EMBED_BASE_URL
  - it: should give the web server the chat URL when the chat host is set
    template: web/env-configmap.yaml
    set:
      agenticTesting:
        instance:
          chatHost: maria-fernanda.ai.portswigger.cloud
    asserts:
      - equal:
          path: data.BSEE_AT_INSTANCE_EMBED_BASE_URL
          value: https://maria-fernanda.ai.portswigger.cloud
