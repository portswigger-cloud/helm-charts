{{- if (.Values.toolbox | default dict).enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scan-controller.fullname" . }}-toolbox-env
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  BSEE_HOSTED_SCANNING_MACHINE_API_KEY: {{ .Values.configuration.apiKey | b64enc }}
{{- end }}
