apiVersion: v1
kind: ServiceAccount
metadata:
  name: scan-controller
  namespace: {{ .Release.Namespace }}
  labels: {{- include "scan-controller.labels" . | nindent 4}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner
  namespace: {{ .Release.Namespace }}
  labels: {{- include "scan-controller.labels" . | nindent 4}}
automountServiceAccountToken: false
{{- if (.Values.toolbox | default dict).enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scan-controller.fullname" . }}-toolbox
  namespace: {{ .Release.Namespace }}
  labels: {{- include "scan-controller.labels" . | nindent 4}}
automountServiceAccountToken: false
{{- end }}
