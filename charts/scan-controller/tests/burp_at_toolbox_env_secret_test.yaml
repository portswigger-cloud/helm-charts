suite: Burp AT toolbox env Secret configuration
templates:
  - burp-at-toolbox-env-secret.yaml
tests:
  - it: should not create a Secret with default values
    asserts:
      - hasDocuments:
          count: 0
  - it: should not create a Secret when the toolbox is off
    set:
      burpAtToolbox:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should tolerate a null toolbox key
    set:
      burpAtToolbox: null
    asserts:
      - hasDocuments:
          count: 0
  - it: should create an empty Secret when the toolbox is on without Auth0 credentials
    set:
      burpAtToolbox:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-scan-controller-burp-at-toolbox-env
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: type
          value: Opaque
      - notExists:
          path: data.BSEE_AUTH0_CLIENT_ID
      - notExists:
          path: data.BSEE_AUTH0_CLIENT_SECRET
  - it: should set Auth0 credentials when the toolbox is on and they are configured
    set:
      burpAtToolbox:
        enabled: true
        auth0ClientId: not-a-client-id
        auth0ClientSecret: not-a-client-secret
    asserts:
      - equal:
          path: data.BSEE_AUTH0_CLIENT_ID
          decodeBase64: true
          value: not-a-client-id
      - equal:
          path: data.BSEE_AUTH0_CLIENT_SECRET
          decodeBase64: true
          value: not-a-client-secret
