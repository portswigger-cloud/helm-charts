suite: Toolbox network policy
templates:
  - toolbox-networkpolicy.yaml
tests:
  - it: should create the policy with default values
    asserts:
      - hasDocuments:
          count: 1
  # Turning toolboxes off does not delete toolbox Jobs straight away, and claimed ones can take up
  # to 30 minutes to save their project. The policy must stay so those pods keep their egress rules.
  - it: should keep the policy when the toolbox is off
    set:
      toolbox:
        enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.endpointSelector.matchLabels["app.kubernetes.io/component"]
          value: scan-controller-toolbox
  - it: should create a policy selecting toolbox pods when the toolbox is on
    set:
      toolbox:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CiliumNetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-scan-controller-toolbox
      - equal:
          path: spec.endpointSelector.matchLabels["app.kubernetes.io/component"]
          value: scan-controller-toolbox
  # DAST's scan-controller relabels toolbox pods (warm -> claimed -> retiring) through
  # portswigger.net/toolbox-state. A selector on that label would drop a pod's network rules
  # the moment it is relabelled.
  - it: should never select toolbox pods on their toolbox-state label
    set:
      toolbox:
        enabled: true
    asserts:
      - notExists:
          path: spec.endpointSelector.matchLabels["portswigger.net/toolbox-state"]
      - notExists:
          path: spec.endpointSelector.matchExpressions
  - it: should tolerate a null toolbox key
    set:
      toolbox: null
    asserts:
      - hasDocuments:
          count: 1
