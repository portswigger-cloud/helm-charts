suite: Toolbox env Secret configuration
templates:
  - toolbox-env-secret.yaml
tests:
  - it: should not create a Secret with default values
    asserts:
      - hasDocuments:
          count: 0
  - it: should tolerate a null toolbox key
    set:
      toolbox: null
    asserts:
      - hasDocuments:
          count: 0
  - it: should hold only the API key when the toolbox is on
    set:
      toolbox:
        enabled: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-scan-controller-toolbox-env
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: data
          value:
            BSEE_HOSTED_SCANNING_MACHINE_API_KEY: bm90LWFuLWFwaS1rZXk=
