suite: Toolbox env Secret configuration
templates:
  - toolbox-env-secret.yaml
tests:
  - it: should not create a Secret with default values
    asserts:
      - hasDocuments:
          count: 0
  - it: should tolerate a null toolbox key
    set:
      toolbox: null
    asserts:
      - hasDocuments:
          count: 0
  - it: should hold the server URL and API key when the toolbox is on
    set:
      toolbox:
        enabled: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-scan-controller-toolbox-env
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: data
          value:
            BSEE_WEB_SERVER_URL: aHR0cHM6Ly9ub3QtYS1zZXJ2ZXIudXJs
            BSEE_HOSTED_SCANNING_MACHINE_API_KEY: bm90LWFuLWFwaS1rZXk=
  - it: should fail when the API key is missing
    set:
      toolbox:
        enabled: true
      configuration:
        apiKey: null
    asserts:
      - failedTemplate:
          errorMessage: configuration.apiKey is required
