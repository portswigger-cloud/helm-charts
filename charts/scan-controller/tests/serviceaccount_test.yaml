suite: Service accounts
templates:
  - serviceaccount.yaml
tests:
  - it: should create the controller, scanner and toolbox accounts
    asserts:
      - hasDocuments:
          count: 3
  - it: should create a toolbox account without a token
    documentIndex: 2
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-scan-controller-toolbox
      - equal:
          path: automountServiceAccountToken
          value: false
