suite: Service accounts
templates:
  - serviceaccount.yaml
tests:
  - it: should not create the toolbox account with default values
    asserts:
      - hasDocuments:
          count: 2
  - it: should create a toolbox account without a token when the toolbox is on
    set:
      toolbox:
        enabled: true
    documentIndex: 2
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-scan-controller-toolbox
      - equal:
          path: automountServiceAccountToken
          value: false
