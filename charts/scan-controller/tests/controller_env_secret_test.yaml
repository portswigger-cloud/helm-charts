suite: Controller env Secret configuration
templates:
  - controller-env-secret.yaml
tests:
  - it: should create Secret with default values
    template: controller-env-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-scan-controller-env
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.BSEE_SERVER_URL
          decodeBase64: true
          value: https://not-a-server.url
      - equal:
          path: data.BSEE_HOSTED_SCANNING_MACHINE_API_KEY
          decodeBase64: true
          value: not-an-api-key
      - equal:
          path: data.BSEE_MAX_SCAN_CONCURRENCY
          decodeBase64: true
          value: "20"
      - notExists:
          path: data.BSEE_TOOLBOX_JOB_TEMPLATE
  - it: should provision the toolbox job template when enabled
    template: controller-env-secret.yaml
    set:
      toolbox:
        enabled: true
    asserts:
      - isNotEmpty:
          path: data.BSEE_TOOLBOX_JOB_TEMPLATE
  - it: should base64 encode the toolbox job template twice
    template: controller-env-secret.yaml
    set:
      toolbox:
        enabled: true
        jobTemplate: "apiVersion: batch/v1"
    asserts:
      - equal:
          path: data.BSEE_TOOLBOX_JOB_TEMPLATE
          decodeBase64: true
          value: YXBpVmVyc2lvbjogYmF0Y2gvdjE=
  - it: should give toolbox jobs a 7-day deadline by default
    template: controller-env-secret.yaml
    set:
      toolbox:
        enabled: true
        jobTemplate: "{{ .Values.toolbox.activeDeadlineSeconds }}"
    asserts:
      - equal:
          path: data.BSEE_TOOLBOX_JOB_TEMPLATE
          decodeBase64: true
          # base64 of "604800"
          value: NjA0ODAw
  - it: should render when the toolbox key is null
    template: controller-env-secret.yaml
    set:
      toolbox: null
    asserts:
      - isKind:
          of: Secret
      - notExists:
          path: data.BSEE_TOOLBOX_JOB_TEMPLATE
  - it: should create Secret with configured values
    template: controller-env-secret.yaml
    set:
      configuration:
        apiKey: "not-another-api-key"
        maxConcurrency: 50
      scanner:
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 512Mi
            memory: 2Gi
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-scan-controller-env
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.BSEE_SERVER_URL
          decodeBase64: true
          value: https://not-a-server.url
      - equal:
          path: data.BSEE_HOSTED_SCANNING_MACHINE_API_KEY
          decodeBase64: true
          value: not-another-api-key
      - equal:
          path: data.BSEE_MAX_SCAN_CONCURRENCY
          decodeBase64: true
          value: "50"
  - it: should set the toolbox warm pool size to 0 by default when toolboxes are enabled
    template: controller-env-secret.yaml
    set:
      toolbox:
        enabled: true
    asserts:
      - equal:
          path: data.BSEE_AT_TOOLBOX_WARM_POOL_SIZE
          decodeBase64: true
          value: "0"
  - it: should set the toolbox warm pool size from toolbox.warmPoolSize
    template: controller-env-secret.yaml
    set:
      toolbox:
        enabled: true
        warmPoolSize: 2
    asserts:
      - equal:
          path: data.BSEE_AT_TOOLBOX_WARM_POOL_SIZE
          decodeBase64: true
          value: "2"
  - it: should not set the toolbox warm pool size when toolboxes are disabled
    template: controller-env-secret.yaml
    asserts:
      - notExists:
          path: data.BSEE_AT_TOOLBOX_WARM_POOL_SIZE
