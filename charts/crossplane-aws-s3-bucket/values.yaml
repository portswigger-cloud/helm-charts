aws:
  region: eu-west-1
  account_id: "123456789012"
  resourcePrefix: my-prefix-
  s3:
    tags: {}
  kms:
    deletionWindowInDays: 7
    tags: {}
stackId: my-stack-id
lifecycle:
  # Days S3 keeps an object version after it is overwritten or deleted.
  noncurrentVersionExpirationDays: 2
  # Days before S3 aborts an unfinished multipart upload and deletes its parts.
  abortIncompleteMultipartUploadDays: 7
