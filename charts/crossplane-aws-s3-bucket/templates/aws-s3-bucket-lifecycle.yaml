apiVersion: s3.aws.upbound.io/v1beta2
kind: BucketLifecycleConfiguration
metadata:
  name: {{ .Values.aws.resourcePrefix }}{{ .Values.stackId }}
  namespace: {{ .Release.Namespace }}
spec:
  forProvider:
    bucketRef:
      name: {{ .Values.aws.resourcePrefix }}{{ .Values.stackId }}
    region: {{ .Values.aws.region }}
    rule:
      # Don't add newerNoncurrentVersions here. S3 keeps that many noncurrent
      # versions of every key regardless of age, so an object that is deleted
      # and never rewritten under the same key (a timestamped dump, say) is
      # kept forever.
      - id: expire-noncurrent-versions
        status: Enabled
        noncurrentVersionExpiration:
          - noncurrentDays: {{ .Values.lifecycle.noncurrentVersionExpirationDays }}
        expiration:
          - expiredObjectDeleteMarker: true
        abortIncompleteMultipartUpload:
          - daysAfterInitiation: {{ .Values.lifecycle.abortIncompleteMultipartUploadDays }}
  providerConfigRef:
    name: aws
